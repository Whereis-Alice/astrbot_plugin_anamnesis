name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout AstrBot
        uses: actions/checkout@v5
        with:
          repository: AstrBotDevs/AstrBot
          path: AstrBot

      - name: Checkout Anamnesis
        uses: actions/checkout@v5
        with:
          path: AstrBot/data/plugins/astrbot_plugin_anamnesis

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AstrBot/requirements.txt
            AstrBot/data/plugins/astrbot_plugin_anamnesis/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AstrBot/requirements.txt
          python -m pip install -r AstrBot/data/plugins/astrbot_plugin_anamnesis/requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run test suite
        working-directory: AstrBot/data/plugins/astrbot_plugin_anamnesis
        run: python -m pytest -q

      - name: Run frontend tests
        working-directory: AstrBot/data/plugins/astrbot_plugin_anamnesis
        run: npm run test:frontend

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Anamnesis
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Verify generated dashboard and browser interactions
        env:
          DASHBOARD_ARTIFACT_DIR: ${{ runner.temp }}/anamnesis-browser
        run: |
          npm run dashboard:check
          npm run test:bridge-browser
          npm run test:browser
          npm run test:profile-review-browser
          npm run test:administration-browser
          npm run test:recall-time-browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: ${{ runner.temp }}/anamnesis-browser
          if-no-files-found: ignore
