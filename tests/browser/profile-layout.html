<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard layout and interaction regression</title>
<style>body{margin:12px;font:14px system-ui;background:#ececec;color:#111}iframe{display:block;width:1280px;height:800px;border:1px solid #aaa;margin-top:12px}pre{white-space:pre-wrap}</style>
<button id="run">Run layout checks</button><label>Preview width <select id="width"><option>1280</option><option>1024</option><option>769</option><option>768</option><option>700</option><option>390</option><option>375</option></select></label>
<pre id="results" role="status">Loading fixture…</pre><iframe id="preview" title="Dashboard with synthetic profile data"></iframe>
<script type="module">
// Only synthetic records. Serve repository root with tests/browser/serve.py.
const frame = document.getElementById('preview'), results = document.getElementById('results');
function fixtureBridge() {
  const people = ['alpha', 'beta', 'gamma'];
  const groupNames = { A:'周末游戏交流群', B:'读书分享会', C:'这是一个很长的群聊名称用来检查窄屏排版' };
  const rows = people.flatMap((person, index) => Array.from({length: person === 'alpha' ? 11 : 2}, (_, fact) => ({
    identity: `opaque:qq:${person}`, profile_scope: `profile:${person}:session:${fact % 2 ? 'B' : 'A'}`,
    profile_key: fact === 0 ? 'preferred_nickname' : `favorite_game_${fact}`,
    display_label: fact === 0 ? '希望使用的称呼' : '喜欢的游戏', category: fact === 0 ? 'identity' : 'preference',
    value: fact === 0 ? `用户希望被称为小林 ${index}` : '喜欢和朋友一起玩游戏，也喜欢分享周末活动。'.repeat(fact === 1 ? 8 : 2),
    confidence: .95, source_session_id: `default:GroupMessage:${fact % 2 ? 'B' : 'A'}`, source_group_id: fact % 2 ? 'B' : 'A',
    source_group_name: groupNames[fact % 2 ? 'B' : 'A'], source_sender_name: `测试用户 ${person}`,
    source_memory_id: fact + 100, updated_at: 1791039600 + fact,
    expires_at: fact === 2 ? 1799999999 : fact === 3 ? 1699999999 : null, suppressed: fact === 4,
  })));
  const user = person => ({ identity:`opaque:qq:${person}`, platform:'qq', sender_id:person, sender_name:`测试用户 ${person}`,
    last_group_id:'C', last_group_name:groupNames.C, fact_count: rows.filter(row => row.identity.endsWith(person)).length, scope_count:2 });
  window.profileFixturePosts = []; window.fixtureFail = new Set();
  const sections = [{key:'user_profile',title:'用户档案',hint:'长期个人档案',fields:[{path:'user_profile.enabled',label:'启用用户档案',hint:'提取用户的稳定偏好和近期状态',type:'bool',value:true,default:true},{path:'user_profile.scope',label:'隔离范围',hint:'按聊天隔离事实，同一用户仅合并展示',type:'string',value:'session',options:['session','user'],option_labels:['按聊天','按用户']}]},{key:'retrieval',title:'记忆检索',fields:[{path:'retrieval.timeout',label:'检索超时（秒）',hint:'等待检索的最长时间',type:'float',value:5,min:0,max:120},{path:'identity.sessions',label:'独立会话',hint:'JSON 数组',type:'list',value:[]}]}];
  window.AstrBotPluginPage = {
    ready: async () => ({ isDark:true,locale:'zh-CN' }), getContext: () => ({isDark:true,locale:'zh-CN'}),
    apiGet: async (path, params = {}) => {
      if(window.fixtureFail.has(path)) throw Error(`Synthetic failure: ${path}`);
      if(path === 'page/profiles/users') {const users = people.map(user); return {users,total:users.length,limit:30,offset:0,has_more:false,profile_enabled:true,scope_mode:'session'};}
      if(path === 'page/profiles') {const items = rows.filter(row => row.identity === params.identity); return {items,total:items.length,limit:500,offset:0,has_more:false,profile_enabled:true,scope_mode:'session'};}
      if(path === 'page/config') return {sections,config:{user_profile:{enabled:true,scope:'session'},retrieval:{timeout:5},identity:{sessions:[]}},reload_required:true};
      if(path === 'page/memories/detail') return {memory_id:Number(params.memory_id),summary:'来源记忆：用户分享了自己的爱好。',importance:.8,status:'active',memory_origin:'agent_memorize_tool',memorize_reason:'用户希望我记住偏好',graph_context:{nodes:[{id:1,label:'游戏',type:'topic'}],edges:[]}};
      if(path === 'page/prompts') return {prompts:[],categories:[]};
      return {nodes:[],edges:[],sessions:{},snapshot:{nodes:[],edges:[]}};
    },
    apiPost: async (path, body) => {
      window.profileFixturePosts.push({path,body});
      if(path === 'page/profiles/update') {const row = rows.find(row => row.profile_scope === body.profile_scope && row.profile_key === body.profile_key); return Object.assign(row,body);}
      if(path === 'page/profiles/delete') {const i=rows.findIndex(row=>row.profile_scope===body.profile_scope&&row.profile_key===body.profile_key);if(i>=0)rows.splice(i,1);return {count:i>=0?1:0};}
      if(path === 'page/config/update') return {config:{},changed_paths:Object.keys(body.updates),reload_required:true};
      if(path === 'page/recall/test') return {results:[{memory_id:100,content:'用户喜欢合作游戏',similarity_score:.72,metadata:{importance:.8},score_breakdown:{document_keyword_score:.2,document_vector_score:.7,graph_keyword_score:0,graph_vector_score:.5}}]};
      return {snapshot:{nodes:[],edges:[],memories:[]}};
    },
  };
}
const source = await (await fetch('../../pages/dashboard/index.html',{cache:'no-store'})).text();
const base = new URL('../../pages/dashboard/',location.href).href;
frame.srcdoc = source.replace('<head>', `<head><base href="${base}"><script>(${fixtureBridge.toString()})();<\/script>`);
async function until(predicate) {const deadline=performance.now()+15000;while(!predicate()){if(performance.now()>deadline)throw Error('Fixture timed out');await new Promise(resolve=>setTimeout(resolve,25));}}
window.addEventListener('unhandledrejection',event=>{results.textContent=`FAIL fixture: ${event.reason?.message || event.reason}`;});
await until(()=>frame.contentDocument?.getElementById('gs-total')?.textContent==='0');
frame.contentWindow.setLanguage('zh',{persist:false});frame.contentDocument.querySelector('[data-page="profiles"]').click();
await until(()=>frame.contentDocument.querySelectorAll('.profile-fact-card').length===11);
await frame.contentDocument.fonts.ready;
const nextFrame=()=>new Promise(resolve=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(resolve)));
function require(condition,message){if(!condition)throw Error(message);}
async function run(){
  const lines=[];document.getElementById('run').disabled=true;
  for(const width of [1280,1024,769,768,700,390,375]){
    frame.style.width=`${width}px`;await nextFrame();
    try{const doc=frame.contentDocument;
      require(doc.querySelectorAll('.profile-user').length===3,'one user must have one directory entry');
      require(doc.querySelectorAll('.profile-source-section').length===2,'chat scopes must stay separate');
      require(doc.querySelectorAll('.profile-fact-card').length===11,'facts missing');
      require(doc.documentElement.scrollWidth<=width+1,'page overflows horizontally');
      for(const el of doc.querySelectorAll('.profile-fact-value')){require(el.scrollWidth<=el.clientWidth+1,'fact text overflows');require(frame.contentWindow.getComputedStyle(el).webkitLineClamp==='none','fact text is truncated');}
      const reader=doc.getElementById('profile-reader');if(width>768)require(reader.clientHeight>100,'reader has no usable height');
      lines.push(`PASS ${width}px: user grouping, full facts, no overflow`);
    }catch(error){lines.push(`FAIL ${width}px: ${error.message}`);}
  }
  frame.style.width='1280px';await nextFrame();results.textContent=lines.join('\n');document.getElementById('run').disabled=false;window.fixtureResults=lines;
}
document.getElementById('run').addEventListener('click',run);document.getElementById('width').addEventListener('change',event=>frame.style.width=`${event.target.value}px`);await run();window.fixtureReady=true;
</script></html>
